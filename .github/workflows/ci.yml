name: CI Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          SA_PASSWORD: YourStrong!Passw0rd
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong!Passw0rd' -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Setup .NET 8 (for Azure Functions)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies (Course examples)
        run: |
          for proj in $(find Course/HangFire/Examples -name "*.csproj"); do
            echo "Restoring $proj..."
            dotnet restore "$proj"
          done

      - name: Restore dependencies (Examples)
        run: |
          for proj in $(find Examples -name "*.csproj" ! -name "*.sln"); do
            echo "Restoring $proj..."
            dotnet restore "$proj"
          done

      - name: Build Course examples
        run: |
          for proj in $(find Course/HangFire/Examples -name "*.csproj"); do
            echo "Building $proj..."
            dotnet build "$proj" --configuration Release --no-restore
          done

      - name: Build Examples
        run: |
          for proj in $(find Examples -name "*.csproj" ! -name "*.sln"); do
            echo "Building $proj..."
            dotnet build "$proj" --configuration Release --no-restore
          done

      - name: Run tests (if any exist)
        run: |
          test_projects=$(find . -name "*Tests.csproj" -o -name "*Test.csproj" 2>/dev/null)
          if [ -n "$test_projects" ]; then
            for proj in $test_projects; do
              echo "Running tests in $proj..."
              dotnet test "$proj" --configuration Release --no-build --verbosity normal
            done
          else
            echo "No test projects found"
          fi

      - name: Install SQL Server tools
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18 unixodbc-dev

      - name: Create HangFire database
        run: |
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong!Passw0rd' -C -Q "CREATE DATABASE HangFire"

      - name: Smoke test - Hangfire SQL Server projects boot
        run: |
          # Find all HangFire web projects that use SQL Server storage
          # Exclude Worker projects (they need Web running first) and Azure Functions
          smoke_projects=$(find Course/HangFire/Examples -path "*/HangFireTactics.Web/*.csproj" -type f 2>/dev/null | grep -v "Worker" || true)
          smoke_projects="$smoke_projects $(find Examples -name "HangfireExample.csproj" 2>/dev/null || true)"
          
          if [ -z "$smoke_projects" ]; then
            echo "No smoke test projects found"
            exit 0
          fi
          
          failed=0
          for proj in $smoke_projects; do
            # Skip if project doesn't use SQL Server (check for UseSqlServerStorage)
            proj_dir=$(dirname "$proj")
            if ! grep -rq "UseSqlServerStorage" "$proj_dir" 2>/dev/null; then
              echo "SKIP (no SQL Server): $proj"
              continue
            fi
            
            echo "Smoke testing $proj..."
            cd "$(dirname "$proj")"
            
            # Start the app in background
            dotnet run --configuration Release --no-build &
            APP_PID=$!
            
            # Wait for startup (up to 30s)
            for i in {1..30}; do
              if curl -s http://localhost:5000 > /dev/null 2>&1 || curl -s http://localhost:5000/hangfire > /dev/null 2>&1; then
                echo "  ✓ Started successfully"
                kill $APP_PID 2>/dev/null || true
                wait $APP_PID 2>/dev/null || true
                break
              fi
              if ! kill -0 $APP_PID 2>/dev/null; then
                echo "  ✗ Process died during startup"
                failed=1
                break
              fi
              sleep 1
            done
            
            # Cleanup
            kill $APP_PID 2>/dev/null || true
            wait $APP_PID 2>/dev/null || true
            cd - > /dev/null
          done
          
          if [ $failed -ne 0 ]; then
            echo "Some smoke tests failed!"
            exit 1
          fi
